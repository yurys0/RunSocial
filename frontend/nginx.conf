server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Аватарка уходит через /api multipart-запросом: 5 МБ плюс запас на заголовки
    client_max_body_size 6m;

    # Сжимаем только свою статику: проксируемые ответы, включая SSE, gzip не трогает
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA: неизвестный путь отдаём index.html, роутинг разбирает React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # В именах файлов хэш содержимого — можно кэшировать навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api срезается, бэкенд о префиксе не знает. Один origin — CORS не нужен
    location /api/ {
        proxy_pass http://backend-api:3000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Prefix /api;

        # Без отключённой буферизации nginx копит SSE и отдаёт события пачкой в конце
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

}
