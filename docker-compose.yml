services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Порт нужен только для запуска бэкенда с хоста; наружу база не смотрит
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      retries: 10

  # Кэш и pub/sub в db 0, очередь BullMQ в db 1. Порт наружу не публикуем: пароля у Redis нет
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # Профиль embedded-s3: с внешним S3-провайдером эти два сервиса не нужны
  minio:
    image: quay.io/minio/minio:latest
    profiles: ['embedded-s3']
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  # Создаёт бакет; наружу он не смотрит — аватарки отдаёт бэкенд
  minio-init:
    image: quay.io/minio/mc:latest
    profiles: ['embedded-s3']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/${S3_BUCKET}
      "

  # Применяет миграции до старта API и завершается
  # Локально образ собирается здесь же; на сервере BACKEND_IMAGE указывает на GHCR
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${BACKEND_IMAGE:-runsocial-backend}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npx', 'prisma', 'migrate', 'deploy']

  # Ядро SuperTokens: пользователи, сессии и роли лежат в схеме supertokens той же базы
  supertokens:
    image: supertokens/supertokens-postgresql:12.2
    restart: unless-stopped
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRESQL_TABLE_SCHEMA: supertokens
      API_KEYS: ${SUPERTOKENS_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      # Схему supertokens создаёт миграция Prisma
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"']
      interval: 10s
      retries: 10

  backend-api:
    image: ${BACKEND_IMAGE:-runsocial-backend}
    restart: unless-stopped
    env_file: .env
    environment:
      # внутри compose хосты — имена контейнеров, а не localhost
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
    ports:
      - '127.0.0.1:${API_PORT}:${API_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      supertokens:
        condition: service_healthy
    command: ['node', 'dist/main.js']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:${API_PORT}/health']
      interval: 10s
      retries: 5

  # Тот же образ, другой entrypoint
  backend-worker:
    image: ${BACKEND_IMAGE:-runsocial-backend}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      backend-api:
        condition: service_started
    command: ['node', 'dist/worker.js']

  # Статика и проксирование /api и /s3; HTTPS терминирует caddy перед ним
  frontend:
    image: ${FRONTEND_IMAGE:-runsocial-frontend}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FRONTEND_PORT}:80'
    # Именно healthy: nginx резолвит имя backend-api при старте
    depends_on:
      backend-api:
        condition: service_healthy

  # Профиль https. Сертификат Caddy получает сам — нужны домен и открытые порты 80 и 443
  caddy:
    image: caddy:2-alpine
    profiles: ['https']
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Без этого тома сертификат выписывался бы заново после каждого перезапуска
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
